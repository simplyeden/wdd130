<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130|HTML User Polls</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>

    </header>
    <main>
        <form>
            <div class="form-item column2">
            <label for="Fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
            </div>
            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>    
            </select>
            <div class="form-item column1">
            <label for="browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>
            </div>
            <div class="form-item column1">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item">
            <label for="feedback">List the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            <button type="submit">Submit Poll</button>
            </div>
        </form>
    </main>

    <footer>

    </footer>
    
</body>
</html>
