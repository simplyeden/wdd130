<body>
    <div class="container"></div>
    <header> <img src="images/logo.jpg" alt="White Water Rafting logo" width="100">
        
         <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a> </li>

            </ul>
        </nav>
        
    </header>
    <main>
        <h1>Contact Us</h1>
        <div class="contact">
        <p>White Water Rafting Company Ltd</p>
        <p>198 Lagordia Creek</p>
        <p>West Oakland Park, Florida|33311</p>
        <p>Phone: <a href="tel:+19546647641">+1(954)-664-7641</a></p>
        <p>Email: <a href="mailto:info@wwradmin.com">info@wwradmin.com</a> </p>
        </div>
        <div class="map-container">
            <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30348.527403743927!2d-77.69292800000001!3d18.0453376!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sjm!4v1775245127301!5m2!1sen!2sjm"
              width="400" height="400" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            </div>
            <div class="message">
                <h2>Send us a message</h2>
                <form>
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" required>
                </div>
                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="janedoe@wwradmin.com" required>
                </div>
                <div class="form-item">
                    <fieldset> <legend>Message <br> Purpose</legend></fieldset>
                    <div class="radio">
                    <input type="radio" id="general" name="purpose" value="general">  
                    <label for="general">General Inquiry</label>
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>
                    <input type="radio" id="suggestions" name="purpose" value="suggestions">
                    <label for="suggestions">Website Suggestions</label>
                    </div>
                    
                </div>
                <div class="form-item">
                    <label for="message">Message
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                    </label>
                </div>
                <div class="form-item">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    
                </div>
        
                <button type="submit" class="button"> Get in touch!</button>
             </form>
            </div>
        </div>
        <section class="box">
            <h2>We Are Here to Serve You</h2> 
            <div class="employee">
            <figure><img src="images/blackwood.jpeg" alt="Reservations" width="150"><figcaption>Javenia Blackwood<br>Reservations Manager</figcaption></figure>
            <figure> <img src="images/medley.jpg" alt="Customer Service" width="150"><figcaption>Eden Medley<br>Customer Care Manager</figcaption></figure>
            <figure> <img src="images/peynado.jpg" alt="Events Cordinator" width="150"><figcaption>Alicia Peynado<br>Events Cordinator</figcaption></figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 🛶 White Water Rafting 🛶 Eden Medley</p>

        </nav>
